# Push a tag like v0.5.0 to build all three apps and publish them as one GitHub Release:
#   rudao-cloud-vX.apk           Android, signed (the app updates itself from it)
#   rudao-cloud-vX-windows.exe   Windows installer (the app downloads and runs it to update)
#   rudao-cloud-vX.ipa           iOS, unsigned: sideload with AltStore / Sideloadly, which sign it
#
#   git tag -a v0.5.0 -m "更新说明（显示在 App 的更新提示里）"
#   git push origin v0.5.0
#
# Required repository secret:
#   SIGNING_KEYSTORE_B64  base64 of the keystore used for all Android builds (keeps updates installable)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_B64" || { echo "::error::secret SIGNING_KEYSTORE_B64 is missing"; exit 1; }
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
      - name: Build
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/signing.keystore
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName="${GITHUB_REF_NAME#v}" \
            -PversionCode=$((GITHUB_RUN_NUMBER + 1))
          cp app/build/outputs/apk/release/app-release.apk "rudao-cloud-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: rudao-cloud-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        run: |
          ./gradlew :desktopApp:packageReleaseExe --no-daemon -PversionName="${GITHUB_REF_NAME#v}"
          cp desktopApp/build/compose/binaries/main-release/exe/*.exe "rudao-cloud-${GITHUB_REF_NAME}-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rudao-cloud-*-windows.exe

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned IPA
        run: |
          chmod +x gradlew
          # The Xcode build phase runs Gradle itself; this makes it see the release version.
          echo "versionName=${GITHUB_REF_NAME#v}" >> gradle.properties
          brew install xcodegen
          (cd iosApp && xcodegen generate)
          xcodebuild -project iosApp/RudaoCloud.xcodeproj -scheme RudaoCloud -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/RudaoCloud.app Payload/
          zip -qr "rudao-cloud-${GITHUB_REF_NAME}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: rudao-cloud-*.ipa

  publish:
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
