# Builds all three apps on any branch push / manual run, without publishing.
# The test packages are attached to the run as artifacts (unsigned / debug-signed).
name: Build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:packageReleaseExe --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktopApp/build/compose/binaries/main-release/exe/*.exe

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned IPA
        run: |
          chmod +x gradlew
          brew install xcodegen
          (cd iosApp && xcodegen generate)
          xcodebuild -project iosApp/RudaoCloud.xcodeproj -scheme RudaoCloud -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/RudaoCloud.app Payload/
          zip -qr rudao-cloud.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: rudao-cloud.ipa
